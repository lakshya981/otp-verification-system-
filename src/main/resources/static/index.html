<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 60px auto; background: #f4f6f8; }
        .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 12px; }
        button { padding: 10px 16px; background: #2b6cb0; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        #status { margin-top: 12px; font-size: 14px; }
        .success { color: #2f855a; }
        .error { color: #c53030; }
        #otpSection { display: none; }
    </style>
</head>
<body>
<div class="card">
    <h2>Phone Verification</h2>

    <div id="phoneSection">
        <input type="text" id="phoneNumber" placeholder="+919876543210" />
        <button onclick="sendOtp()">Send OTP</button>
    </div>

    <div id="otpSection">
        <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" />
        <button onclick="verifyOtp()">Verify OTP</button>
    </div>

    <div id="status"></div>
</div>

<script>
    async function sendOtp() {
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        const statusDiv = document.getElementById('status');

        try {
            const res = await fetch('/api/otp/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber })
            });
            const data = await res.json();

            if (res.ok) {
                statusDiv.className = 'success';
                statusDiv.textContent = data.status + ' (check server console logs if Twilio is disabled)';
                document.getElementById('otpSection').style.display = 'block';
            } else {
                statusDiv.className = 'error';
                statusDiv.textContent = data.status;
            }
        } catch (e) {
            statusDiv.className = 'error';
            statusDiv.textContent = 'Request failed: ' + e.message;
        }
    }

    async function verifyOtp() {
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        const otp = document.getElementById('otp').value.trim();
        const statusDiv = document.getElementById('status');

        try {
            const res = await fetch('/api/otp/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber, otp })
            });
            const data = await res.json();

            statusDiv.className = res.ok ? 'success' : 'error';
            statusDiv.textContent = data.status;
        } catch (e) {
            statusDiv.className = 'error';
            statusDiv.textContent = 'Request failed: ' + e.message;
        }
    }
</script>
</body>
</html>
