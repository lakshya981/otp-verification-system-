server.port=8081
spring.application.name=otp-verification-system

# --- H2 in-memory database ---
spring.datasource.url=jdbc:h2:mem:otpdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Twilio SMS (disabled by default; OTP is logged to console instead) ---
# Set twilio.enabled=true and fill these in from https://www.twilio.com/try-twilio to send real SMS
twilio.enabled=false
twilio.account-sid=YOUR_ACCOUNT_SID
twilio.auth-token=YOUR_AUTH_TOKEN
twilio.from-number=YOUR_TWILIO_PHONE_NUMBER

# --- Resilience4j: Circuit Breaker for the Twilio SMS call ---
# If Twilio calls fail repeatedly, the circuit "opens" and stops calling Twilio
# for a cooldown period instead of letting every request hang/fail slowly.
resilience4j.circuitbreaker.instances.twilioSms.sliding-window-size=10
resilience4j.circuitbreaker.instances.twilioSms.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.twilioSms.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.twilioSms.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.twilioSms.automatic-transition-from-open-to-half-open-enabled=true

# --- Resilience4j: Retry for transient failures (e.g. a momentary network blip) ---
resilience4j.retry.instances.twilioSms.max-attempts=3
resilience4j.retry.instances.twilioSms.wait-duration=2s

# Expose actuator endpoints so you can watch the circuit breaker's state live during a demo:
# http://localhost:8081/actuator/health  and  http://localhost:8081/actuator/circuitbreakers
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
